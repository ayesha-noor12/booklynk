name: booklynk
description: A modern book reading app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase (UPDATED)
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3

  # PDF viewers
  flutter_pdfview: ^1.4.1
  syncfusion_flutter_pdfviewer: ^32.1.19

  # File handling
  file_picker: ^10.3.8
  path_provider: ^2.1.5
  path: ^1.9.0

  # Storage
  sqflite: ^2.4.2
  shared_preferences: ^2.5.4

  # Network
  http: ^1.2.0

  url_launcher: ^6.2.6
  #url_launcher: ^6.2.1

  # State management
  provider: ^6.1.5

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  flutter_tts: ^3.8.5
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"